<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>登录 | 个人执行 Dashboard</title>
    <meta
      name="description"
      content="登录个人执行 Dashboard，支持用户名密码登录。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="auth-page" data-theme="light">
    <main class="auth-page-shell">
      <section class="auth-gate-card" aria-labelledby="login-page-title">
        <p class="panel-kicker">Cloud Sync</p>
        <h1 id="login-page-title">登录后同步到云端</h1>
        <p class="auth-gate-copy">
          登录后你的任务与备注会写入云端。首次使用可先创建账号，之后直接用用户名和密码登录。
        </p>
        <form id="login-form" class="auth-gate-form">
          <label class="settings-field">
            <span class="widget-label">用户名</span>
            <input
              name="username"
              type="text"
              placeholder="输入用户名"
              autocomplete="username"
              required
            />
          </label>
          <label class="settings-field">
            <span class="widget-label">密码</span>
            <input
              name="password"
              type="password"
              placeholder="输入你的密码"
              autocomplete="current-password"
              required
            />
          </label>
          <div class="settings-field captcha-field">
            <span class="widget-label">验证码</span>
            <div class="captcha-row">
              <input
                name="captchaText"
                type="text"
                placeholder="输入图形验证码"
                autocomplete="off"
                spellcheck="false"
                required
              />
              <button type="button" id="captcha-refresh" class="task-cancel-action">
                刷新
              </button>
            </div>
            <button
              type="button"
              id="captcha-image"
              class="captcha-image"
              aria-label="点击刷新验证码"
              title="点击刷新验证码"
            ></button>
          </div>
          <p id="login-feedback" class="settings-copy"></p>
          <div class="auth-gate-actions">
            <button type="submit" class="settings-save" data-auth-action="signin">
              登录
            </button>
            <button type="submit" class="auth-button" data-auth-action="signup">
              创建账号
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="./js/login.js" defer></script>
  </body>
</html>
